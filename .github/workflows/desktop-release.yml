name: Desktop Windows Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing desktop-vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-approval-policy:
    name: Require protected release approval
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify a release environment with required approval exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$RELEASE_REPOSITORY/environments/windows-release" > "$RUNNER_TEMP/release-environment.json"
          node - "$RUNNER_TEMP/release-environment.json" <<'NODE'
          const fs = require('node:fs');
          const environment = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const approval = environment.protection_rules?.find(rule => rule.type === 'required_reviewers');
          if (!approval?.reviewers?.length) {
            throw new Error('Configure windows-release with a required reviewer before signing releases.');
          }
          NODE

  windows-release:
    name: Signed-off Desktop release build
    needs: release-approval-policy
    runs-on: windows-latest
    environment: windows-release
    permissions:
      contents: write

    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release version and reviewed main history
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Expected a stable desktop-vX.Y.Z tag." }
          $version = node -p "require('./desktop/package.json').version"
          if ($tag -ne "desktop-v$version") { throw "Release tag $tag does not match Desktop package version $version" }
          $tagCommit = git rev-parse "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) { throw "Release must check out the existing tag exactly." }
          git fetch origin main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag must point to a commit already on main" }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test complete frontend regression suite
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand

      - name: Test incremental campaign update package generator
        run: python -m unittest discover -s desktop/tools -p "test_*.py"

      - name: Build Keeper frontend
        working-directory: frontend
        run: yarn build

      - name: Stage renderer
        shell: pwsh
        run: |
          if (Test-Path desktop/renderer) { Remove-Item desktop/renderer -Recurse -Force }
          Copy-Item frontend/build desktop/renderer -Recurse

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Test backups and restoration
        working-directory: desktop
        run: npm test

      - name: Test closed copied Chromium profile extraction in real Electron
        working-directory: desktop
        run: node tools/run-copied-profile-smoke.cjs

      - name: Upload copied-profile extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Release-Copied-Profile-Diagnostics
          path: desktop/copied-profile-smoke-report.json
          if-no-files-found: ignore

      - name: Test real Electron startup before signing
        working-directory: desktop
        run: node tools/run-startup-smoke.cjs

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Release-Startup-Diagnostics
          path: desktop/startup-smoke-report.json
          if-no-files-found: ignore

      # Configure these as protected GitHub Actions settings before releasing:
      # Secrets: RQK_WINDOWS_CERT_PFX, RQK_WINDOWS_CERT_PASSWORD
      # Variable: RQK_WINDOWS_PUBLISHER (exact certificate common name).
      # PR builds NEVER receive these signing secrets.
      - name: Require approved Windows release signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.RQK_WINDOWS_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.RQK_WINDOWS_CERT_PASSWORD }}
          RQK_WINDOWS_PUBLISHER: ${{ vars.RQK_WINDOWS_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Signing certificate secrets are not configured. Refusing an unsigned public release."
          }
          if ([string]::IsNullOrWhiteSpace($env:RQK_WINDOWS_PUBLISHER)) {
            throw "RQK_WINDOWS_PUBLISHER is missing. Refusing to build an update without a pinned publisher."
          }

      - name: Build signed Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.RQK_WINDOWS_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.RQK_WINDOWS_CERT_PASSWORD }}
          RQK_WINDOWS_PUBLISHER: ${{ vars.RQK_WINDOWS_PUBLISHER }}
        run: |
          npx electron-builder --win nsis --x64 --publish never --config.forceCodeSigning=true "--config.win.publisherName=$env:RQK_WINDOWS_PUBLISHER"
          if ($LASTEXITCODE -ne 0) { throw "Signed NSIS build failed." }

      - name: Test signed packaged installed edition offline and after restart
        working-directory: desktop
        run: node tools/packaged-startup-smoke.cjs

      - name: Upload packaged startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Release-Packaged-Startup-Diagnostics
          path: desktop/packaged-startup-smoke-report.json
          if-no-files-found: ignore

      - name: Verify every Windows executable and release manifest
        shell: pwsh
        env:
          RQK_WINDOWS_PUBLISHER: ${{ vars.RQK_WINDOWS_PUBLISHER }}
        run: |
          $executables = @(Get-ChildItem desktop/dist -Filter '*.exe')
          if ($executables.Count -ne 1) { throw "Expected exactly one signed installed-edition setup executable." }
          $installedExecutable = Get-Item 'desktop/dist/win-unpacked/Rookie Quest Keeper.exe'
          $executables += $installedExecutable
          foreach ($file in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
              throw "Unsigned or untrusted Windows release binary: $($file.Name)"
            }
            $publisher = $signature.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -cne $env:RQK_WINDOWS_PUBLISHER) {
              throw "Release publisher does not match the approved Windows signer: $($file.Name)"
            }
          }
          node desktop/tools/verify-windows-release.cjs desktop/dist "$env:RQK_WINDOWS_PUBLISHER"
          if ($LASTEXITCODE -ne 0) { throw "Release metadata or installer integrity verification failed." }

      # Keep the release as a draft until a human tests install/update/rollback.
      # Offer only the auto-updatable signed installer; portable builds remain QA artifacts.
      # Only VERIFIED binaries and manifest assets reach the GitHub release.
      - name: Upload verified files to DRAFT GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $verified = Get-Content desktop/dist/release-verification.json -Raw | ConvertFrom-Json
          $assets = @($verified.assets | ForEach-Object { Join-Path desktop/dist $_ })
          $assets += 'desktop/dist/release-verification.json'
          $existing = gh release view "$tag" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw "Refusing to replace files on a published release." }
            gh release upload "$tag" @assets --clobber
          } else {
            gh release create "$tag" @assets --draft --title "Rookie Quest Keeper $tag"
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to create verified draft release." }

      - name: Keep verified release artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: Rookie-Quest-Keeper-Release-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
            desktop/dist/*.blockmap
            desktop/dist/release-verification.json
          retention-days: 14
          if-no-files-found: error

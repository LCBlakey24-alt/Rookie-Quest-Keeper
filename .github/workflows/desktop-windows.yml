name: Desktop Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/desktop-windows.yml"

jobs:
  windows-installer:
    name: Windows offline installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Test desktop local-mode seam
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand --runTestsByPath src/preview/desktopOfflineMode.test.js src/preview/desktopCampaignPack.test.js src/preview/DesktopMaintenance.programUpdate.test.js src/components/gm/NpcCompactStatBlock.test.js src/data/offlineBestiaryChaosFate.test.js src/data/tiaKartaCalendar.test.js

      - name: Test incremental campaign update package generator
        run: python -m unittest discover -s desktop/tools -p "test_*.py"

      - name: Build Keeper frontend
        working-directory: frontend
        run: yarn build

      - name: Stage renderer
        shell: pwsh
        run: |
          if (Test-Path desktop/renderer) { Remove-Item desktop/renderer -Recurse -Force }
          Copy-Item frontend/build desktop/renderer -Recurse

      - name: Install desktop packager
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Test local backups and restore protection
        working-directory: desktop
        run: npm test

      - name: Test real Electron application-update startup
        working-directory: desktop
        shell: pwsh
        run: |
          node tools/run-startup-smoke.cjs
          $startupExit = $LASTEXITCODE
          Get-Content startup-smoke-report.json
          if ($startupExit -ne 0) { throw "Updated application startup failed: $startupExit" }

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Startup-Diagnostics
          path: desktop/startup-smoke-report.json
          if-no-files-found: ignore

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - name: Build Windows portable USB edition
        working-directory: desktop
        run: npm run dist:portable

      - name: Upload application source for offline release signing
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Application-For-Signing
          path: |
            desktop/*.js
            desktop/package.json
            desktop/renderer/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Rookie-Quest-Keeper-Desktop-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 14

name: Desktop Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/desktop-windows.yml"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows QA installer (not a signed release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test desktop local-mode seam
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand --runTestsByPath src/preview/desktopOfflineMode.test.js src/preview/desktopCampaignPack.test.js src/preview/DesktopMaintenance.programUpdate.test.js src/preview/offlineCustomBestiary.test.js src/lib/monsterStatBlockAdapter.test.js src/components/gm/NpcCompactStatBlock.test.js src/components/gm/MonstersTab.details.test.js src/components/tabs/NPCsTab.statBlock.test.js src/components/NPCCombatRecruiter.safety.test.js src/data/offlineBestiaryChaosFate.test.js src/data/tiaKartaCalendar.test.js

      - name: Test incremental campaign update package generator
        run: python -m unittest discover -s desktop/tools -p "test_*.py"

      - name: Build Keeper frontend
        working-directory: frontend
        run: yarn build

      - name: Test full frontend regression suite
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand

      - name: Stage renderer
        shell: pwsh
        run: |
          if (Test-Path desktop/renderer) { Remove-Item desktop/renderer -Recurse -Force }
          Copy-Item frontend/build desktop/renderer -Recurse

      - name: Install desktop packager
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Test local backups and restore protection
        working-directory: desktop
        run: npm test

      - name: Test closed copied Chromium profile extraction in real Electron
        working-directory: desktop
        run: node tools/run-copied-profile-smoke.cjs

      - name: Upload copied-profile extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Copied-Profile-Diagnostics
          path: desktop/copied-profile-smoke-report.json
          if-no-files-found: ignore

      - name: Test real Electron application-update startup
        working-directory: desktop
        shell: pwsh
        run: |
          node tools/run-startup-smoke.cjs
          $startupExit = $LASTEXITCODE
          Get-Content startup-smoke-report.json
          if ($startupExit -ne 0) { throw "Updated application startup failed: $startupExit" }

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Startup-Diagnostics
          path: desktop/startup-smoke-report.json
          if-no-files-found: ignore

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - name: Test packaged installed edition offline and restart persistence
        working-directory: desktop
        run: node tools/packaged-startup-smoke.cjs

      - name: Upload packaged startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Packaged-Startup-Diagnostics
          path: desktop/packaged-startup-smoke-report.json
          if-no-files-found: ignore

      - name: Build next-version installer for disposable upgrade trial
        working-directory: desktop
        shell: pwsh
        run: |
          $initial = node -p "require('./package.json').version"
          $parts = $initial.Split('.')
          $next = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          $nextOutput = Join-Path $env:RUNNER_TEMP 'Keeper-Synthetic-Upgrade-Build'
          npx electron-builder --win nsis --x64 --publish never "--config.extraMetadata.version=$next" "--config.directories.output=$nextOutput"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic QA upgrade setup build failed.' }
          "RQK_QA_INITIAL_VERSION=$initial" >> $env:GITHUB_ENV
          "RQK_QA_UPGRADE_VERSION=$next" >> $env:GITHUB_ENV
          "RQK_QA_UPGRADE_OUTPUT=$nextOutput" >> $env:GITHUB_ENV

      - name: Test real NSIS install upgrade uninstall and previous-installer recovery
        working-directory: desktop
        shell: pwsh
        run: |
          $initial = @(Get-ChildItem dist -File -Filter '*.exe')
          $next = @(Get-ChildItem -LiteralPath $env:RQK_QA_UPGRADE_OUTPUT -File -Filter '*.exe')
          if ($initial.Count -ne 1 -or $next.Count -ne 1) { throw 'Expected exactly the initial and synthetic upgrade QA installers.' }
          ./tools/windows-installer-lifecycle.ps1 -InitialInstaller $initial[0].FullName -NextInstaller $next[0].FullName -InitialVersion $env:RQK_QA_INITIAL_VERSION -NextVersion $env:RQK_QA_UPGRADE_VERSION

      - name: Upload installer lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Installer-Lifecycle-Diagnostics
          path: desktop/installer-lifecycle*.json
          if-no-files-found: ignore

      - name: Build Windows portable USB edition
        working-directory: desktop
        run: npm run dist:portable

      - name: Upload application source for offline release signing
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-Application-For-Signing
          path: |
            desktop/*.js
            desktop/package.json
            desktop/renderer/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Rookie-Quest-Keeper-Desktop-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Explain QA artifact safety
        shell: pwsh
        run: |
          @"
          ## Windows QA build only
          These pull-request installers are unsigned test artifacts, not approved releases.
          Use only a disposable profile or test PC. Do not replace an existing Keeper installation.
          Official releases require protected approval, the approved Windows certificate, verified updater metadata and a reviewed draft release.
          "@ >> $env:GITHUB_STEP_SUMMARY

name: Build check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  player-workspace-api:
    name: Player access and timeline persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install route test dependencies
        run: pip install -c backend/requirements.txt fastapi pydantic motor pymongo PyJWT bcrypt python-dotenv email-validator python-multipart resend
      - name: Test player access, timeline persistence and handout summary
        run: |
          python -m unittest discover -s backend/tests -p test_player_workspace.py -v
          python -m unittest discover -s backend/tests -p test_player_handout_summary.py -v
          python -m unittest discover -s backend/tests -p test_campaign_invite_routes.py -v
          python -m unittest discover -s backend/tests -p test_level_up_state_preservation.py -v

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Run frontend tests
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand

      - name: Build frontend
        run: yarn build

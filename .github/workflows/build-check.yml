name: Build check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Show lockfile drift
        run: git diff -- yarn.lock

      - name: Run frontend tests
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand

      - name: Build frontend
        run: yarn build
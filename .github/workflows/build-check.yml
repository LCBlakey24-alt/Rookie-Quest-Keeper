name: Build check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  player-workspace-api:
    name: Player access and route persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check for committed reusable test credentials
        run: python scripts/check_test_credentials.py
      - name: Test credential guard rules
        run: python -m unittest discover -s scripts -p 'test_check_test_credentials.py' -v

      - name: Install route test dependencies
        run: pip install -c backend/requirements.txt fastapi pydantic motor pymongo PyJWT bcrypt python-dotenv email-validator python-multipart pytest requests google-auth httpx
      - name: Test player access and timeline persistence
        run: |
          python -m unittest discover -s backend/tests -p test_player_workspace.py -v
          python -m unittest discover -s backend/tests -p test_player_handout_summary.py -v
          python -m unittest discover -s backend/tests -p test_player_quest_routes.py -v
          python -m unittest discover -s backend/tests -p test_auth_login_fast.py -v
      - name: Test focused backend routes
        run: |
          python -m pytest -q \
            backend/tests/test_campaign_display_routes.py \
            backend/tests/test_admin_assign_character.py \
            backend/tests/test_token_movement.py \
            backend/tests/test_npc_roster_resilience.py \
            backend/tests/test_campaign_collections_resilience.py \
            backend/tests/test_child_account_access.py \
            backend/tests/test_ai_source_boundary_coverage.py \
            backend/tests/test_rook_brain.py \
            backend/tests/test_rook_chat_route.py \
            backend/tests/test_rook_form_fill_route.py \
            backend/tests/test_rook_generate_route.py \
            backend/tests/test_world_hierarchy_routes.py \
            backend/tests/test_inventory_claim_routes.py \
            backend/tests/test_custom_creature_routes.py \
            backend/tests/test_npc_full_editor_contract.py \
            backend/tests/test_npc_statblock_response_models.py \
            backend/tests/test_npc_relationship_edit.py \
            backend/tests/test_map_mutation_routes.py \
            backend/tests/test_map_record_routes.py \
            backend/tests/test_world_record_update_routes.py \
            backend/tests/test_campaign_record_update_routes.py \
            backend/tests/test_inventory_grant_routes.py \
            backend/tests/test_handout_recipient_membership.py \
            backend/tests/test_player_content_membership.py \
            backend/tests/test_live_party_combat_state.py \
            backend/tests/test_fast_startup.py \
            backend/tests/test_character_journey_regression.py \
            backend/tests/test_account_deletion_collection_coverage.py \
            backend/tests/test_rate_limit_utils.py \
            backend/tests/test_ws_messages.py \
            backend/tests/test_health_wiring.py \
            backend/tests/test_map_media_models.py \
            backend/tests/test_custom_calendar_rules.py \
            backend/tests/test_auth_password_policy.py \
            backend/tests/test_auth_username_validation.py \
            backend/tests/test_auth_account_profile.py \
            backend/tests/test_admin_identity.py \
            backend/tests/test_access_checks.py \
            backend/tests/test_upload_limits.py \
            backend/tests/test_session_and_socket_hardening.py \
            backend/tests/test_character_patch_campaign_idor.py \
            backend/tests/test_character_patch_state.py \
            backend/tests/test_progression_admin_gate.py \
            backend/tests/test_half_third_caster_own_slots.py \
            backend/tests/test_multiclass_spell_slot_pool.py \
            backend/tests/test_subclass_unlock_edition.py \
            backend/tests/test_campaign_content_gm_writes.py \
            backend/tests/test_feat_edition_categories.py \
            backend/tests/test_entity_stats_default_composition.py \
            backend/tests/test_npc_portrait_models.py \
            backend/tests/test_ruleset_mass_assignment.py \
            backend/tests/test_campaign_ruleset_identity_sharing.py \
            backend/tests/test_ruleset_route_permissions.py \
            backend/tests/test_ai_route_quota_metering.py \
            backend/tests/test_con_asi_retroactive_hp.py \
            backend/tests/test_campaign_members_authorization.py \
            backend/tests/test_known_spell_swap_2014.py \
            backend/tests/test_password_recovery_observability.py

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Parse Playwright E2E suite
        run: |
          cd ../tests
          yarn install --non-interactive
          yarn playwright test --list --config=playwright.config.ts

      - name: Run frontend tests
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand

      - name: Build frontend
        run: yarn build

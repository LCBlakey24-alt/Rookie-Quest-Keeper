name: Responsive browser smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser-smoke:
    name: Real Chromium responsive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: |
            frontend/yarn.lock
            tests/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Build release frontend
        working-directory: frontend
        run: yarn build

      - name: Install focused browser tests
        working-directory: tests
        run: yarn install --non-interactive

      - name: Install Chromium and required Linux libraries
        working-directory: tests
        run: yarn playwright install --with-deps chromium

      - name: Exercise built app at phone, tablet, desktop and TV resolutions
        working-directory: tests
        run: yarn playwright test --config=playwright.responsive.config.ts --project=chromium

      - name: Save failure screenshots, traces and HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keeper-responsive-browser-report
          path: |
            tests/test-results
          if-no-files-found: ignore
          retention-days: 7
